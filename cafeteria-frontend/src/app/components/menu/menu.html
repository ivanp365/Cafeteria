<p>menu works!</p>
<div class="menu-page">
  <div class="menu-header">
    <h1>Nuestro Menú</h1>
    <p>Escoge tu favorito</p>
  </div>

  <div class="filtros">
    <button [class.activo]="categoriaSeleccionada === null" (click)="filtrar(null)">Todos</button>
    <button *ngFor="let cat of categorias"
      [class.activo]="categoriaSeleccionada === cat.id"
      (click)="filtrar(cat.id)">
      {{cat.nombre}}
    </button>
  </div>

  <div class="loading" *ngIf="cargando">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>

  <div class="productos-grid" *ngIf="!cargando">
    <div class="producto-card" *ngFor="let producto of productos">
      <div class="producto-img">
        <img *ngIf="producto.imagen_url" [src]="producto.imagen_url" [alt]="producto.nombre" (error)="producto.imagen_url=''">
        <span *ngIf="!producto.imagen_url">🍽️</span>
      </div>
      <div class="producto-info">
        <span class="categoria-tag">{{producto.categoria_nombre}}</span>
        <h3>{{producto.nombre}}</h3>
        <div class="producto-footer">
          <span class="precio">{{formatPrecio(producto.precio)}}</span>
          <button class="btn-agregar" [class.agregado]="agregados[producto.id]" (click)="agregar(producto)">
            {{agregados[producto.id] ? '✓ Agregado' : '+ Agregar'}}
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="empty" *ngIf="!cargando && productos.length === 0">
    <span>😕</span>
    <p>No hay productos en esta categoría</p>
  </div>
</div>
