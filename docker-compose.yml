version: '3.8'
services:
  django:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./cafeteria-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4000"
    environment:
      - NODE_ENV=production
    depends_on:
      - django